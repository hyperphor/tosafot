<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tosafot settings</title>
  <link rel="icon" href="icons/icon32.png">
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; max-width: 720px; margin: 2em auto; color: #222; }
    h1 { font-size: 20px; display: flex; align-items: center; gap: .4em; }
    h1 img { width: 32px; height: 32px; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; margin: 0 0 1em; padding: .8em 1em; }
    legend { font-weight: 600; }
    label { display: block; margin: .5em 0 .2em; font-size: 12px; color: #555; }
    input[type=text], input[type=password], select, textarea { width: 100%; box-sizing: border-box; padding: 5px; font: inherit; }
    textarea { min-height: 5em; }
    .row { display: flex; gap: .8em; align-items: center; }
    .row > * { flex: 1; }
    .actions { display: flex; gap: .6em; margin-top: 1em; align-items: center; }
    button { padding: 5px 12px; font: inherit; cursor: pointer; }
    .status { color: #2a7; }
    .status.error { color: #c0392b; }
    .inline { display: flex; gap: .4em; align-items: center; margin: .6em 0; font-size: 14px; color: #222; }
    .inline input { width: auto; }
    .help { color: #666; font-size: 13px; margin: .2em 0 .8em; }
    .action-row { border-top: 1px solid #eee; padding: .45em 0; }
    .action-row.off { opacity: .5; }
    .action-row .row { gap: .4em; }
    .action-row .row > .label { flex: 0 0 9em; }
    .action-row .row > .prompt { flex: 1; }
    .action-row .row > .place { flex: none; margin: 0; font-size: 13px; }
    .action-row textarea.instructions { min-height: 0; margin-top: .3em; font-size: 12px; color: #555; resize: vertical; }
    .row-buttons { display: flex; gap: .25em; flex: none !important; }
    .row-buttons button { padding: 4px 7px; }
  </style>
</head>
<body>
  <h1><img src="icons/icon128.png" alt="">Tosafot settings</h1>
  <div id="app"></div>
  <script src="js/options/options.js"></script>
</body>
</html>
